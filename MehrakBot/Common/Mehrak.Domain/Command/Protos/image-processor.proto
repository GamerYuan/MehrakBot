syntax = "proto3";

package imageprocessor.v1;

option csharp_namespace = "Mehrak.Domain.Protobuf";

message ClassifyRequest {
  bytes image_data = 1;
}

message ClassifyResponse {
  bool is_nsfw = 1;
  float nsfw_confidence = 2;
  float sfw_confidence = 3;
}

message ProcessWeaponImageRequest {
  repeated bytes images = 1;
}

message ProcessWeaponImageResponse {
  bytes processed_image = 1;
}

message MatchImageRequest {
  bytes reference_image = 1;
  bytes candidate_image = 2;
}

message MatchImageResponse {
  bool is_match = 1;
  float confidence = 2;
}

service ImageProcessorService {
  rpc ClassifyImage (ClassifyRequest) returns (ClassifyResponse);
  rpc ProcessWeaponImage (ProcessWeaponImageRequest) returns (ProcessWeaponImageResponse);
  rpc MatchImage (MatchImageRequest) returns (MatchImageResponse);
}
