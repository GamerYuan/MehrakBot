name: Build Docker Images
permissions:
  contents: read
  packages: write
  actions: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    concurrency:
      group: build-release-${{ github.ref_name }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        include:
          - image-name: ghcr.io/gameryuan/mehrakbot/mehrak-application
            dockerfile: ./MehrakBot/Services/Application/Dockerfile

          - image-name: ghcr.io/gameryuan/mehrakbot/mehrak-bot
            dockerfile: ./MehrakBot/Services/Bot/Dockerfile

          - image-name: ghcr.io/gameryuan/mehrakbot/mehrak-dashboard
            dockerfile: ./MehrakBot/Services/Dashboard/Dockerfile

          - image-name: ghcr.io/gameryuan/mehrakbot/mehrak-image-processor
            dockerfile: ./MehrakBot/Services/ImageProcessor/Dockerfile

          - image-name: ghcr.io/gameryuan/mehrakbot/mehrak-migration-service
            dockerfile: ./MehrakBot/Services/MigrationService/Dockerfile

    steps:
      - name: Derive build version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Extract OpenCvSharp version
        run: |
          OPENCVSHARP_VERSION=$(grep -oP '(?<=<PackageReference Include="OpenCvSharp4" Version=")[^"]+' MehrakBot/Services/ImageProcessor/Mehrak.ImageProcessor/Mehrak.ImageProcessor.csproj)
          OPENCV_VERSION=$(echo "$OPENCVSHARP_VERSION" | cut -d. -f1-3)
          echo "OPENCV_VERSION=$OPENCV_VERSION" >> $GITHUB_ENV
          echo "OPENCVSHARP_VERSION=$OPENCVSHARP_VERSION" >> $GITHUB_ENV
          echo "BASE_IMAGE_TAG=opencv-${OPENCV_VERSION}-ocvsharp-${OPENCVSHARP_VERSION}" >> $GITHUB_ENV

      - name: Setup SixLabors License
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: printf '%s' "$SIXLABORS_LICENSE" > MehrakBot/sixlabors.lic

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image-name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        env:
          VERSION: ${{ env.VERSION }}
          BASE_IMAGE_TAG: ${{ env.BASE_IMAGE_TAG }}
        with:
          context: ./MehrakBot
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            ${{ matrix.image-name == 'ghcr.io/gameryuan/mehrakbot/mehrak-image-processor' && format('BASE_IMAGE_TAG={0}', env.BASE_IMAGE_TAG) || '' }}
          secret-files: |
            sixlabors-license=MehrakBot/sixlabors.lic
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup SixLabors License
        if: always()
        run: rm -f MehrakBot/sixlabors.lic
      
